name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Dev tooling (vitest 5, tsdown, wrangler) needs 22.18+; the library itself targets 20.19+.
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # The example builds and runs its Bun target when Bun is present.
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Builds the packages first: the example's vite configs import the built @composurejs/vite,
      # and test/build.test.ts builds and runs the example for every target.
      - run: pnpm test
      # Every create-composurejs template, generated, installed, typechecked, tested and built.
      - run: node scripts/check-templates.mjs
      # Bundle budgets (.size-limit.json): fail when an entry point or the example Worker grows past its limit.
      - run: pnpm size
      # The guide: every ```ts twoslash snippet is type-checked against the built packages.
      - run: pnpm -C docs build
      # Cold start on workerd against an empty Worker: a report, since timings vary between machines.
      - run: pnpm -C examples/bot coldstart
        continue-on-error: true
