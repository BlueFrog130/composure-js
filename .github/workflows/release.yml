name: Release

# On main: with pending changesets, opens (or updates) a "Version Packages" PR. Once it is merged,
# `changeset publish` publishes every package whose version npm lacks, with provenance, and the
# action pushes a tag and creates one GitHub release per published package (notes from its
# CHANGELOG.md).
# Auth: npm trusted publishing (OIDC), a publisher per package for this workflow with "allow
# publish" on. Also needs "Allow GitHub Actions to create and approve pull requests" in
# Settings > Actions > General.
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds every package, so the publish ships fresh dist.
      - run: pnpm test
      - uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm changeset publish
          pr-title: Version Packages
          commit-message: Version Packages
          create-github-releases: true
        env:
          # @changesets/changelog-github reads it to link each entry to its PR and author.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
