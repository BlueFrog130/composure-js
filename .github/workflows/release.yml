name: Release

# On main: opens (or updates) a "Version Packages" PR from the pending changesets; merging it
# stages the bumped packages on npm (`pnpm stage publish -r`: every package whose version the
# registry lacks) with provenance. A maintainer then approves each staged version with 2FA, on
# the package's Staged Packages tab or with `npm stage approve <stage-id>`; until then a push to
# main stages it again. `changeset publish` cannot stage (changesets/changesets#2025), so no git
# tags or GitHub releases are made here.
# Auth: trusted publishing (OIDC) per package, set up once the package exists on npm; until
# then the NPM_TOKEN secret (a stage-only granular token). Also needs "Allow GitHub Actions to
# create and approve pull requests" in Settings > Actions > General.
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # Builds every package, so the stage step ships fresh dist.
      - run: pnpm test
      - uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm stage publish -r
          pr-title: Version Packages
          commit-message: Version Packages
          create-github-releases: false
        env:
          # @changesets/changelog-github reads it to link each entry to its PR and author.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Read by setup-node's .npmrc. Empty once NPM_TOKEN is deleted: OIDC then.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
